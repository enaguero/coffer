[project]
name = "coffer-backend"
version = "0.1.0"
description = "Coffer personal finance API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.3",
    "pydantic[email]>=2.9.2",
    "pydantic-settings>=2.6.1",
    "email-validator>=2.2.0",
    "pyjwt>=2.9.0",
    "bcrypt>=4.2.0",
    "python-multipart>=0.0.12",
    "pdfplumber>=0.11.4",
    "python-dateutil>=2.9.0",
    "slowapi>=0.1.9",
    "httpx>=0.27.2",
    "cryptography>=43.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "httpx>=0.27.2",
    "ruff>=0.7.4",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's idiomatic Depends/File/Form are evaluated once at import — B008 is a false positive here.
"app/api/v1/*.py" = ["B008"]
# SQLAlchemy relationship() lines with forward-ref strings + noqa comments
# routinely exceed 120 chars; the readability win is worth the tail.
"app/models/*.py" = ["E501"]
# seed.py uses an intentionally column-aligned table of demo data.
"app/seed.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:pdfminer.*",
]
